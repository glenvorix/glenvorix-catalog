<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog</title>
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #1da851;
      --text: #1f2937;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #6b7280;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #f3f4f6;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .card-desc {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .btn-whatsapp:hover {
      background-color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Our Store Catalog</h1>
      <p>Browse products and order directly on WhatsApp</p>
    </header>

    <div class="grid" id="productGrid"></div>
  </div>

  <script>
    // 1. Set your WhatsApp number (Include country code, no "+" or "-" symbols. Example for India: 919876543210)
    const WHATSAPP_PHONE = "917259880169";

    // 2. Add or edit your products here
    const products = [
      {
        id: 1,
        name: "Classic Leather Backpack",
        description: "Durable vintage leather bag with laptop sleeve.",
        price: "$49.99",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop&q=60"
      },
      {
        id: 2,
        name: "Wireless ANC Headphones",
        description: "Active noise cancelling with 40-hour battery life.",
        price: "$79.99",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=60"
      },
      {
        id: 3,
        name: "Minimalist Watch",
        description: "Sleek stainless steel watch with leather strap.",
        price: "$35.00",
        image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600&auto=format&fit=crop&q=60"
      }
    ];

    // 3. Render cards dynamically
    const grid = document.getElementById("productGrid");

    products.forEach((product) => {
      const message = `Hello! I would like to order:\n- *Product:* ${product.name}\n- *Price:* ${product.price}`;
      const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${product.image}" alt="${product.name}" loading="lazy" />
        <div class="card-body">
          <div class="card-title">${product.name}</div>
          <div class="card-desc">${product.description}</div>
          <div class="card-footer">
            <span class="price">${product.price}</span>
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
              Order on WhatsApp
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
