<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glenvorix Catalog</title>
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #1da851;
      --brand-blue: #0056b3;
      --text: #1f2937;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Navbar & Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-logo {
      height: 56px;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      color: blue;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .brand-tagline {
      font-size: 0.95rem;
      font-weight: 600;
      font-style: italic;
      /* Colorful gradient text */
      background: linear-gradient(90deg, #ff007a, #7928ca, #0070f3, #25D366);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0.3rem;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      font-size: 0.9rem;
    }

    .contact-item {
      color: #4b5563;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .contact-item:hover {
      color: var(--primary);
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background-color: #f3f4f6;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 800;
      color: #111827;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .btn-whatsapp:hover {
      background-color: var(--primary-dark);
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .brand-section {
        flex-direction: column;
      }
      .contact-info {
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-section">
        <img src="logo.jpeg" alt="Glenvorix Logo" class="brand-logo" onerror="this.src='logo.jpg'" />
        <div>
          <h1 class="brand-title" style="color: blue;">GLENVORIX</h1>
          <p class="brand-tagline">Where Everyday Essentials Meet Modern Living</p>
        </div>
      </div>

      <div class="contact-info">
        <a href="mailto:glenvorix@gmail.com" class="contact-item">✉️ glenvorix@gmail.com</a>
        <div class="contact-item">
          📞 <a href="tel:8805442774" class="contact-item">8805442774</a> / 
          <a href="tel:7259880169" class="contact-item">7259880169</a>
        </div>
      </div>
    </header>

    <div class="grid" id="productGrid"></div>
  </div>

  <script>
    const WHATSAPP_PHONE = "918805442774";

    const products = [
      {
        id: 1,
        name: "Size - S",
        specification: "Dimension: 17x19",
        price: "Rs 40",
        image: "ImageS.jpg"
      },
      {
        id: 2,
        name: "Size - M",
        specification: "Dimension: 19x21",
        price: "Rs 50",
        image: "ImageM.jpg"
      },
      {
        id: 3,
        name: "Size - L",
        specification: "Dimension: 24x32",
        price: "Rs 65",
        image: "ImageL.jpg"
      }
    ];

    const grid = document.getElementById("productGrid");

    products.forEach((product) => {
      const message = `Hello Glenvorix! I would like to order:\n- *Item:* ${product.name}\n- *Specification:* ${product.specification}\n- *Price:* ${product.price}`;
      const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${product.image}" alt="${product.name}" loading="lazy" />
        <div class="card-body">
          <div class="card-title">${product.name}</div>
          <div class="card-desc">${product.specification}</div>
          <div class="card-footer">
            <span class="price">${product.price}</span>
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
              Order on WhatsApp
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
